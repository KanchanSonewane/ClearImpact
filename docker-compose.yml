services:
  app:
    build: .
    container_name: clearimpact-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/clearimpact
      - JWT_SECRET=clearimpact_production_secret_key_demo_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_sandbox}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-sandbox_secret}
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: clearimpact-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
